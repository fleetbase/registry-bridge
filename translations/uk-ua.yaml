        extension-sale-price: Акційна ціна
        extension-sale-price-help-text: Якщо розширення зараз пропонується зі знижкою, введіть акційну ціну тут. Вона має бути меншою за звичайну ціну.
        extension-subscription-required: Потрібна підписка
        extension-subscription-required-help-text: Визначає, чи повинен користувач мати підписку для встановлення та використання цього розширення.
        extension-subscription-billing-period: Розрахунковий період підписки
        extension-subscription-billing-period-placeholder: Оберіть розрахунковий період
        extension-subscription-billing-period-help-text: Вкажіть розрахунковий період для підписки. Наприклад: щомісяця, щокварталу, щорічно або інші власні інтервали.
        extension-subscription-amount: Вартість підписки
        extension-subscription-amount-help-text: Введіть стандартну суму для стягнення за підписку. Вона має відображати звичайну ціну до застосування будь-яких знижок чи багаторівневих коригувань.
        extension-subscription-model: Модель підписки
        extension-subscription-model-help-text: Визначає тип цінової моделі підписки. Варіанти включають фіксовану ставку, багаторівневу підписку та підписку на основі використання.
        extension-subscription-tiers: Рівні підписки
        extension-subscription-tiers-help-text: Визначте різні рівні цін для підписки, якщо це застосовно. Включіть деталі, такі як рівні, ціноутворення для кожного рівня, а також будь-які специфічні функції чи обмеження кожного рівня.
        extension-name-help-text: Введіть офіційну назву розширення. Вона відображатиметься як основний ідентифікатор для користувачів.
        extension-icon-help-text: Завантажте іконку, яка представляє розширення. Ця іконка буде використовуватися в списках та результатах пошуку.
        extension-description-help-text: Надайте детальний опис того, що робить розширення, та його основних функцій. Ця інформація допомагає користувачам зрозуміти функціонал розширення.
        extension-tags-help-text: Додайте відповідні ключові слова та теги, які описують розширення, допомагаючи користувачам знайти його через пошук.
        extension-promotional-text-help-text: Напишіть рекламний текст, щоб виділити унікальні переваги розширення. Цей текст буде використовуватися в маркетингових або обраних розділах.
        extension-subtitle-help-text: Надайте короткий підзаголовок, який містить додатковий контекст або інформацію про розширення.
        extension-website-url-help-text: Введіть URL-адресу офіційного веб-сайту розширення або сторінки продукту для отримання додаткової інформації.
        extension-repo-url-help-text: Вкажіть URL-адресу репозиторію коду розширення (наприклад, GitHub, GitLab), якщо це застосовно.
        extension-support-url-help-text: Вкажіть URL-адресу, де користувачі можуть отримати підтримку, поставити запитання або повідомити про проблеми з розширенням.
        extension-privacy-policy-url-help-text: Посилання на документ політики конфіденційності, у якому детально описано, як обробляються та захищаються дані користувачів.
        extension-tos-url-help-text: Посилання на документ умов використання, з якими користувачі повинні погодитися перед використанням розширення.
        extension-primary-language-help-text: Вкажіть основну мову, якою розроблено або доступно розширення.
        extension-version-help-text: Вкажіть поточну версію розширення. Це важливо для відстеження оновлень та сумісності.
