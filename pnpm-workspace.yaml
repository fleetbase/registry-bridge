# These packages only print donation notices or provide optional macOS watchers.
# CI builds do not need to execute their dependency install scripts.
allowBuilds:
  '@fortawesome/fontawesome-common-types': false
  '@fortawesome/fontawesome-svg-core': false
  '@fortawesome/free-brands-svg-icons': false
  '@fortawesome/free-solid-svg-icons': false
  core-js: false
  fsevents: false
