# Coverage is reported, not enforced: a drop shows on the pull request without failing it.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

flags:
  backend:
    paths:
      - server/src/

comment:
  layout: "condensed_header, diff, flags, files"
  require_changes: true
